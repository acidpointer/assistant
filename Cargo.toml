[workspace]
resolver = "3"
members = ["crates/assistant", "crates/llama_cpp", "crates/llama_cpp_sys"]
default-members = ["crates/assistant"]

[workspace.dependencies]
anyhow = "1.0.104"
bindgen = "0.73.2"
cc = "1.2.63"
clap = { version = "4.6.1", features = ["derive"] }
criterion = "0.8.2"
encoding_rs = "0.8.35"
llama_cpp = { path = "crates/llama_cpp", default-features = false }
llama_cpp_sys = { path = "crates/llama_cpp_sys", version = "0.9.0" }
thiserror = "2.0.21"
tracing = "0.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = { level = "allow", priority = 0 }

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
