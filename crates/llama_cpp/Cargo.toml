[package]
name = "llama_cpp"
description = "llama.cpp bindings for Rust"
version = "0.9.0"
publish = false
edition = "2021"
# The floor is set by the dependency graph, not by this crate's own syntax.
# `llama_cpp_sys`'s `ureq` build-dependency pulls url -> idna -> icu_*, which
# declare 1.88; this crate's own code only needs 1.82 (for `&raw const`). Lower
# it only after checking the graph again:
#   cargo metadata | jq -r '.packages[]|select(.rust_version)|.rust_version'
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Eugene Hauptmann"]
repository = "https://github.com/eugenehp/llama-cpp-rs"
keywords = ["llama", "llm", "ggml", "gguf", "inference"]
categories = ["api-bindings", "science"]

[dependencies]
enumflags2 = "0.7.12"
llama_cpp_sys = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
encoding_rs = { workspace = true }
criterion = { workspace = true }

[features]
# `ggml` is free to enable: it gates Rust API only and appears nowhere in the
# sys build script. `rpc` costs a GGML_RPC backend build on every downstream
# build, and is on by request.
default = ["openmp", "mtmd", "ggml", "rpc"]
cuda = ["llama_cpp_sys/cuda"]
metal = ["llama_cpp_sys/metal"]
dynamic-link = ["llama_cpp_sys/dynamic-link"]
vulkan = ["llama_cpp_sys/vulkan"]
webgpu = ["llama_cpp_sys/webgpu"]
blas = ["llama_cpp_sys/blas"]
opencl = ["llama_cpp_sys/opencl"]
hip = ["llama_cpp_sys/hip"]
native = ["llama_cpp_sys/native"]
openmp = ["llama_cpp_sys/openmp"]
rpc = ["llama_cpp_sys/rpc"]
mtmd = ["llama_cpp_sys/mtmd"]
ggml = []
# Retained as a no-op so `--features q1` keeps resolving. Q1_0 quantization is
# upstream now (ftype 40, ggml type 41) and unconditional, and the patch this
# used to stage is gone — see the note on `GgmlType::Q1_0`.
q1 = ["llama_cpp_sys/q1"]
prebuilt = ["llama_cpp_sys/prebuilt"]
[lints]
workspace = true

[package.metadata.docs.rs]
all-features = false
features = ["mtmd", "ggml", "rpc"]

[[bench]]
name = "tensor_transactions"
harness = false

[[bench]]
name = "decode_hooks"
harness = false
