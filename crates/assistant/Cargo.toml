[package]
name = "assistant"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
llama_cpp = { workspace = true }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "signal", "process", "io-util", "io-std"] }

[features]
default = ["vulkan"]
cuda = ["llama_cpp/cuda"]
metal = ["llama_cpp/metal"]
vulkan = ["llama_cpp/vulkan"]

[lints]
workspace = true
