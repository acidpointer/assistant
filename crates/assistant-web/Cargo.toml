[package]
name = "assistant-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
assistant = { path = "../assistant", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
