<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Assistant</title>
  <style nonce="__CSP_NONCE__">
    /* Tokens are the only theme boundary; layout never depends on theme. */
    :root {
      color-scheme: light;
      --canvas: #faf9f6;
      --surface: #ffffff;
      --text: #242825;
      --muted: #626b64;
      --line: #dcded8;
      --accent: #245c49;
      --on-accent: #ffffff;
      --user: #edf0e9;
      --danger: #a12b2b;
      --focus: #298065;
      font: 16px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --canvas: #181c1a;
        --surface: #202622;
        --text: #e9ece7;
        --muted: #a4aea5;
        --line: #3b443d;
        --accent: #a6d8bd;
        --on-accent: #183526;
        --user: #28342c;
        --danger: #ffadad;
        --focus: #a6d8bd;
      }
    }

    /* A single constrained scroll region keeps the composer reachable. */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body { color: var(--text); background: var(--canvas); }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .45; }
    button:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 3px; }
    .app { height: 100%; height: 100vh; display: flex; flex-direction: column; }
    @supports (height: 100dvh) { .app { height: 100dvh; } }
    .header { flex: none; padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); }
    .header-inner, .conversation-inner, .composer-inner { width: 100%; max-width: 48rem; margin: 0 auto; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 1rem; font-weight: 650; letter-spacing: -.02em; }
    .connection { margin-left: 1rem; font-size: .8rem; color: var(--muted); }
    .connection::before { content: ""; display: inline-block; width: .4rem; height: .4rem; margin-right: .45rem; border-radius: 50%; background: currentColor; }
    .connection[data-connected="true"] { color: var(--accent); }
    .conversation { flex: 1 1 auto; min-height: 0; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 1.5rem 1.25rem; }
    .empty { padding: 12vh 0 2rem; }
    .empty h2 { margin: 0 0 .5rem; font-size: 1.8rem; font-weight: 550; letter-spacing: -.045em; }
    .empty p { margin: 0; color: var(--muted); }
    .retention { margin: 0 0 1.5rem; color: var(--muted); font-size: .8rem; }
    .messages { list-style: none; margin: 0; padding: 0; }
    .message { min-width: 0; margin: 0 0 1.5rem; }
    .message[data-role="user"] { background: var(--user); padding: .85rem 1.1rem; border-radius: 1rem; }
    .message-heading { display: flex; align-items: baseline; margin-bottom: .4rem; font-size: .8rem; }
    .message-role { font-weight: 650; }
    .message-status { margin-left: .65rem; color: var(--muted); font-size: .75rem; }
    .message-text { white-space: pre-wrap; overflow-wrap: break-word; word-wrap: break-word; word-break: break-word; }
    .composer { flex: none; padding: .5rem 1.25rem 1rem; padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); }
    .jump-row { text-align: center; min-height: 2.25rem; }
    .jump { padding: .25rem .8rem; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 2rem; font-size: .8rem; }
    .input-box { display: flex; align-items: flex-end; padding: .6rem; background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; }
    textarea { flex: 1 1 auto; min-width: 0; width: 100%; min-height: 2.8rem; max-height: 25vh; padding: .55rem .6rem; resize: none; border: 0; background: transparent; color: var(--text); line-height: 1.5; }
    textarea:focus { outline-offset: -2px; border-radius: .4rem; }
    .submit { flex: none; min-height: 2.8rem; min-width: 4.5rem; padding: .55rem .9rem; margin-left: .5rem; background: var(--accent); color: var(--on-accent); border: 0; border-radius: .65rem; font-size: .9rem; font-weight: 600; }
    .feedback { min-height: 1.6rem; margin: .5rem .15rem 0; font-size: .75rem; color: var(--muted); }
    .feedback[data-error="true"] { color: var(--danger); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
    noscript { display: block; padding: 1rem; }
    @media (max-width: 480px) {
      .header { padding: .7rem .85rem; }
      .conversation { padding: 1.2rem .85rem; }
      .composer { padding-left: .75rem; padding-right: .75rem; }
      .empty h2 { font-size: 1.5rem; }
    }
    @media (max-height: 480px) {
      .header { padding-top: .4rem; padding-bottom: .4rem; }
      .empty { padding-top: 1rem; }
      .jump-row { min-height: 1.5rem; }
      .composer { padding-top: 0; padding-bottom: .4rem; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div id="app" class="app">
    <header class="header">
      <div class="header-inner">
        <h1>Assistant</h1>
        <span id="connection" class="connection" data-connected="false">Connecting</span>
      </div>
    </header>
    <main id="conversation" class="conversation" aria-label="Conversation" tabindex="0">
      <div class="conversation-inner">
        <p id="retention" class="retention" hidden>Earlier messages are no longer retained in this conversation.</p>
        <div id="empty" class="empty">
          <h2>What’s on your mind?</h2>
          <p>One conversation, ready when you are.</p>
        </div>
        <ol id="messages" class="messages" aria-label="Messages"></ol>
      </div>
    </main>
    <footer class="composer">
      <div class="composer-inner">
        <div class="jump-row"><button id="jump" class="jump" type="button" hidden>Jump to latest ↓</button></div>
        <form id="form" class="input-box">
          <label for="input" class="sr-only">Message Assistant</label>
          <textarea id="input" rows="1" maxlength="16384" placeholder="Message Assistant…" aria-describedby="feedback"></textarea>
          <button id="submit" class="submit" type="submit" disabled>Send</button>
        </form>
        <p id="feedback" class="feedback">Connecting to your assistant…</p>
      </div>
    </footer>
  </div>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript>This conversation requires JavaScript.</noscript>
  <script nonce="__CSP_NONCE__">
  (function () {
    'use strict';

    /**
     * The transport dispatches typed changes; transition owns application state;
     * the view batches DOM writes. No server-provided text is interpreted as HTML.
     * Runtime state and drafts stay in memory. Reconnecting never submits input.
     *
     * @typedef {{id: string, run_id: string, role: string, text: string, status: string}} Message
     * @typedef {{id: string, client_id: string, client_request_id: string, status: string, error: ?string, warning_count: number, unknown_tool_outcome: boolean}} Run
     * @typedef {{reset: boolean, parts: string[]}} Patch
     */
    var dom = {};
    ['app', 'connection', 'conversation', 'retention', 'empty', 'messages', 'jump', 'form', 'input', 'submit', 'feedback', 'announcer'].forEach(function (id) {
      dom[id] = document.getElementById(id);
    });
    var terminal = new Set(['completed', 'truncated', 'cancelled', 'deadline', 'failed']);
    var state = {
      connected: false, chat: '', instance: '', active: null, pending: null,
      posting: false, messages: new Map(), order: [], truncated: false,
      error: '', activity: '', draft: '', announcement: '', inputLimit: 16384
    };
    var nodes = new Map();
    var dirty = new Map();
    var rebuild = false;
    var frame = 0;
    var pinned = true;
    var resizeInput = true;
    var resizeViewport = true;
    var source = null;
    var reconnectTimer = 0;
    var reconnectDelay = 1000;
    var connecting = false;
    var disposed = false;
    var encoder = typeof TextEncoder === 'function' ? new TextEncoder() : null;
    var clientId = '';

    /** Generate a submission identity without depending on newer randomUUID(). */
    function randomId() {
      var bytes = new Uint8Array(16);
      window.crypto.getRandomValues(bytes);
      return Array.from(bytes, function (byte) { return ('0' + byte.toString(16)).slice(-2); }).join('');
    }

    /** Commands have a deadline. Timeout leaves delivery ambiguous, never retried here. */
    async function request(path, body) {
      var controller = new AbortController();
      var timer = window.setTimeout(function () { controller.abort(); }, 10000);
      try {
        var options = {credentials: 'same-origin', cache: 'no-store', redirect: 'error', signal: controller.signal};
        if (body !== undefined) {
          options.method = 'POST';
          options.headers = {'Content-Type': 'application/json', 'X-Assistant-Client': 'webui'};
          options.body = JSON.stringify(body);
        }
        var response = await fetch(path, options);
        var value = await response.json();
        if (!response.ok) {
          var error = new Error(value.code || 'request_failed');
          error.code = value.code;
          throw error;
        }
        return value;
      } finally {
        window.clearTimeout(timer);
      }
    }

    /** Queue bounded view changes; a complete replacement supersedes deltas. */
    function mark(id, reset, text) {
      var patch = dirty.get(id) || {reset: false, parts: []};
      if (reset) { patch.reset = true; patch.parts = []; }
      else if (!patch.reset && text) { patch.parts.push(text); }
      dirty.set(id, patch);
    }
    function validMessage(message) {
      return message && typeof message.id === 'string' && message.id.length <= 256 &&
        typeof message.run_id === 'string' && typeof message.text === 'string' &&
        message.text.length <= 1048576 && (message.role === 'user' || message.role === 'assistant');
    }
    /** Acknowledgment clears only the submitted draft, never newer typing. */
    function acknowledge(run) {
      if (state.pending && run.client_id === clientId && run.client_request_id === state.pending.id) {
        if (state.draft === state.pending.text) { state.draft = ''; resizeInput = true; }
        state.pending = null;
        state.error = '';
      }
    }

    /** All remote state transitions happen here, independently of DOM rendering. */
    function transition(change) {
      if (!change || typeof change.type !== 'string') { throw new Error('invalid_protocol'); }
      if (change.type === 'snapshot') {
        var snapshot = change.snapshot;
        if (!snapshot || !Array.isArray(snapshot.messages) || snapshot.messages.length > 128 ||
            typeof snapshot.chat_id !== 'string' || typeof snapshot.instance_id !== 'string') {
          throw new Error('invalid_protocol');
        }
        if (state.instance && state.instance !== snapshot.instance_id) {
          state.pending = null;
          state.error = 'Assistant restarted. This is a new conversation; your draft is still here.';
        }
        state.chat = snapshot.chat_id;
        state.instance = snapshot.instance_id;
        state.messages.clear(); state.order = []; dirty.clear();
        var total = 0;
        snapshot.messages.forEach(function (message) {
          if (!validMessage(message)) { throw new Error('invalid_protocol'); }
          total += message.text.length;
          if (total > 1048576 || state.messages.has(message.id)) { throw new Error('invalid_protocol'); }
          state.messages.set(message.id, message); state.order.push(message.id);
        });
        state.active = snapshot.active_run;
        state.truncated = Boolean(snapshot.truncated);
        (snapshot.recent_runs || []).forEach(acknowledge);
        state.connected = true; state.activity = ''; rebuild = true;
      } else if (change.type === 'run') {
        var run = change.run;
        if (!run || typeof run.id !== 'string' || typeof run.status !== 'string') { throw new Error('invalid_protocol'); }
        acknowledge(run);
        if (terminal.has(run.status)) {
          if (state.active && state.active.id === run.id) { state.active = null; }
          state.activity = '';
          if (run.error && run.status !== 'cancelled') { state.error = runError(run.error); }
          if (run.warning_count) { state.error = 'The response completed with a service warning.'; }
          if (run.unknown_tool_outcome) { state.error = 'A tool may have completed before interruption. Check its outcome before retrying.'; }
          state.announcement = run.status === 'completed' ? 'Assistant response completed.' : 'Response ' + run.status + '.';
        } else { state.active = run; state.announcement = 'Assistant is responding.'; }
      } else if (change.type === 'message') {
        var message = change.message;
        if (!validMessage(message)) { throw new Error('invalid_protocol'); }
        if (!state.messages.has(message.id)) { state.order.push(message.id); }
        state.messages.set(message.id, message); mark(message.id, true);
      } else if (change.type === 'delta') {
        var target = state.messages.get(change.message_id);
        if (!target || typeof change.text !== 'string' || target.text.length + change.text.length > 1048576) {
          throw new Error('invalid_protocol');
        }
        target.text += change.text; mark(target.id, false, change.text);
      } else if (change.type === 'activity') {
        state.activity = typeof change.label === 'string' ? change.label.slice(0, 80) : '';
      } else if (change.type === 'evicted') {
        change.message_ids.forEach(function (id) { state.messages.delete(id); dirty.delete(id); });
        state.order = state.order.filter(function (id) { return state.messages.has(id); });
        state.truncated = true;
      }
      if (state.order.length > 160) { throw new Error('invalid_protocol'); }
      scheduleRender();
    }

    function runError(code) {
      var labels = {
        context_budget_exceeded: 'This message does not fit the available context. Try a shorter message.',
        deadline: 'The response reached its time limit.',
        closed: 'Assistant is shutting down.',
        limit_exceeded: 'The response reached an application limit.'
      };
      return labels[code] || 'The response could not be completed. Any partial text is shown above.';
    }
    function scheduleRender() {
      if (!frame) { frame = window.requestAnimationFrame(render); }
    }
    function createMessage(message) {
      var item = document.createElement('li'); item.className = 'message';
      item.dataset.role = message.role;
      var heading = document.createElement('div'); heading.className = 'message-heading';
      var role = document.createElement('span'); role.className = 'message-role';
      role.textContent = message.role === 'user' ? 'You' : 'Assistant';
      var status = document.createElement('span'); status.className = 'message-status';
      var content = document.createElement('div'); content.className = 'message-text';
      var text = document.createTextNode(message.text); content.appendChild(text);
      heading.appendChild(role); heading.appendChild(status); item.appendChild(heading); item.appendChild(content);
      return {item: item, status: status, text: text};
    }

    /** One frame performs text writes, then at most one intentional scroll. */
    function render() {
      frame = 0;
      if (rebuild) {
        dom.messages.textContent = ''; nodes.clear();
        var fragment = document.createDocumentFragment();
        state.order.forEach(function (id) {
          var node = createMessage(state.messages.get(id)); nodes.set(id, node); fragment.appendChild(node.item);
        });
        dom.messages.appendChild(fragment); rebuild = false;
      }
      nodes.forEach(function (node, id) {
        if (!state.messages.has(id)) { node.item.remove(); nodes.delete(id); }
      });
      dirty.forEach(function (patch, id) {
        var message = state.messages.get(id);
        if (!message) { return; }
        var node = nodes.get(id);
        if (!node) { node = createMessage(message); nodes.set(id, node); dom.messages.appendChild(node.item); }
        else if (patch.reset) { node.text.data = message.text; }
        else if (patch.parts.length) { node.text.appendData(patch.parts.join('')); }
      });
      dirty.clear();
      nodes.forEach(function (node, id) {
        var message = state.messages.get(id);
        node.status.textContent = message.role === 'assistant' && terminal.has(message.status) && message.status !== 'completed' ?
          {truncated: 'Length limit', cancelled: 'Stopped', deadline: 'Time limit', failed: 'Incomplete'}[message.status] || '' : '';
      });
      dom.empty.hidden = state.order.length > 0;
      dom.retention.hidden = !state.truncated;
      dom.connection.textContent = state.connected ? 'Connected' : 'Reconnecting';
      dom.connection.dataset.connected = String(state.connected);
      var stopping = state.active && state.active.status === 'stopping';
      dom.submit.textContent = state.active ? (stopping ? 'Stopping…' : 'Stop') : (state.posting ? 'Sending…' : 'Send');
      if (dom.input.value !== state.draft) { dom.input.value = state.draft; }
      if (dom.announcer.textContent !== state.announcement) { dom.announcer.textContent = state.announcement; }
      var inputBytes = encoder ? encoder.encode(state.draft).length : 0;
      var oversized = inputBytes > state.inputLimit;
      dom.submit.disabled = !canSubmit();
      dom.feedback.dataset.error = String(Boolean(state.error) || oversized);
      dom.feedback.textContent = state.error || (oversized ? 'Message is too long. Please shorten it.' :
        state.active ? (stopping ? 'Stopping the response…' : state.activity || 'Thinking…') :
        state.connected ? 'Enter to send · Shift + Enter for a new line' : 'Reconnecting to your assistant…');
      dom.conversation.setAttribute('aria-busy', String(Boolean(state.active)));
      if (resizeViewport) {
        if (window.visualViewport) { dom.app.style.height = window.visualViewport.height + 'px'; }
        resizeViewport = false;
      }
      if (resizeInput) {
        dom.input.style.height = 'auto';
        dom.input.style.height = dom.input.scrollHeight + 'px';
        resizeInput = false;
      }
      if (pinned) { dom.conversation.scrollTop = dom.conversation.scrollHeight; }
      dom.jump.hidden = pinned || !state.order.length;
    }

    function reconnect() {
      if (disposed || reconnectTimer) { return; }
      reconnectTimer = window.setTimeout(function () { reconnectTimer = 0; connect(); }, reconnectDelay);
      reconnectDelay = Math.min(15000, reconnectDelay * 2);
    }
    function protocolFailure() {
      if (source) { source.close(); source = null; }
      state.connected = false;
      scheduleRender(); reconnect();
    }
    /** Discovery runs on initial connection or a closed/obsolete event source. */
    async function connect() {
      if (disposed || connecting) { return; }
      connecting = true;
      if (source) { source.close(); source = null; }
      try {
        var bootstrap = await request('/api/v1/bootstrap');
        if (bootstrap.api_version !== 1 || typeof bootstrap.primary_chat_id !== 'string') { throw new Error('invalid_protocol'); }
        state.inputLimit = bootstrap.limits.input_bytes;
        if (disposed) { return; }
        var current = new EventSource('/api/v1/chats/' + encodeURIComponent(bootstrap.primary_chat_id) + '/events');
        source = current;
        current.addEventListener('snapshot', function (event) {
          if (current !== source) { return; }
          try { transition({type: 'snapshot', snapshot: JSON.parse(event.data)}); reconnectDelay = 1000; }
          catch (error) { protocolFailure(); }
        });
        current.addEventListener('update', function (event) {
          if (current !== source) { return; }
          try { transition(JSON.parse(event.data)); } catch (error) { protocolFailure(); }
        });
        current.onerror = function () {
          if (current !== source) { return; }
          state.connected = false; scheduleRender();
          // Native EventSource reconnect handles transient loss. A closed source
          // (for example an expired chat after restart) needs fresh discovery.
          if (current.readyState === EventSource.CLOSED) { reconnect(); }
        };
      } catch (error) { state.connected = false; scheduleRender(); reconnect(); }
      finally { connecting = false; }
    }

    function canSubmit() {
      if (!state.connected || state.posting || (state.active && state.active.status === 'stopping')) { return false; }
      return Boolean(state.active) || Boolean(encoder && state.draft.trim() && encoder.encode(state.draft).length <= state.inputLimit);
    }
    /** User actions alone submit commands; event recovery never invokes this. */
    async function submit(event) {
      event.preventDefault();
      if (!canSubmit()) { return; }
      var cancelling = Boolean(state.active);
      state.error = ''; state.posting = true; scheduleRender();
      try {
        if (state.active) {
          await request('/api/v1/runs/' + encodeURIComponent(state.active.id) + '/cancel', {});
        } else {
          var text = state.draft;
          var pending = state.pending;
          // A deliberate retry may reuse its key only in the same instance and
          // retention window. Automatic reconnection never enters this path.
          if (!pending || pending.text !== text || pending.chat !== state.chat || performance.now() >= pending.expires) {
            pending = {id: randomId(), text: text, chat: state.chat, expires: performance.now() + 600000};
          }
          state.pending = pending;
          var run = await request('/api/v1/chats/' + encodeURIComponent(state.chat) + '/runs', {
            client_id: clientId, client_request_id: pending.id, input: {type: 'text', text: text}
          });
          acknowledge(run);
          // SSE may already have delivered completion before this HTTP reply.
          // Only the ordered event stream changes conversation/run state.
          scheduleRender();
        }
      } catch (error) {
        if (cancelling || state.pending) {
        state.error = error.code === 'chat_busy' ? 'A response is already in progress.' :
          error.code === 'capacity_exceeded' ? 'Assistant is at capacity. Please try again shortly.' :
          'Delivery could not be confirmed. Check the conversation before trying again.';
        }
      } finally { state.posting = false; scheduleRender(); }
    }

    dom.form.addEventListener('submit', submit);
    dom.input.addEventListener('input', function () { state.draft = dom.input.value; resizeInput = true; scheduleRender(); });
    function viewportChanged() { resizeViewport = true; resizeInput = true; scheduleRender(); }
    window.addEventListener('resize', viewportChanged);
    if (window.visualViewport) { window.visualViewport.addEventListener('resize', viewportChanged); }
    dom.input.addEventListener('keydown', function (event) {
      // Safari can end composition before the Enter keydown; 229 covers that case.
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
        event.preventDefault(); submit(event);
      }
    });
    dom.conversation.addEventListener('scroll', function () {
      pinned = dom.conversation.scrollHeight - dom.conversation.scrollTop - dom.conversation.clientHeight < 80;
      dom.jump.hidden = pinned || !state.order.length;
    }, {passive: true});
    dom.jump.addEventListener('click', function () { pinned = true; scheduleRender(); });
    document.addEventListener('visibilitychange', scheduleRender);
    window.addEventListener('pagehide', function () {
      disposed = true;
      if (source) { source.close(); }
      window.clearTimeout(reconnectTimer);
    });
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) { disposed = false; connect(); }
    });

    if (!window.fetch || !window.EventSource || !window.AbortController || !encoder || !window.crypto || !window.crypto.getRandomValues) {
      dom.connection.textContent = 'Unavailable';
      dom.feedback.textContent = 'This browser is missing a required feature. Please use a supported browser.';
      dom.feedback.dataset.error = 'true';
      return;
    }
    clientId = randomId();
    connect();
  }());
  </script>
</body>
</html>
